{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h3 mb-2 text-center">Login</h1>
        <p class="text-muted text-center mb-4">Sign in as a student or TPO admin. You will be redirected automatically.</p>
        <form method="post">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" maxlength="255" value="{{ request.form.get('email', '') }}" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" minlength="6" maxlength="128" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="alert alert-light border mt-3 mb-0">
          <strong>Demo Admin Account</strong>
          <div class="small mt-2">Email: <code>admin@college.edu</code></div>
          <div class="small">Password: <code>admin123</code></div>
        </div>
        <p class="mt-3 mb-0 text-center">Student? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
