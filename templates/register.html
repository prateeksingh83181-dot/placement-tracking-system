{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h3 mb-4">Student Registration</h1>
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6"><label for="name" class="form-label">Name</label><input class="form-control" id="name" name="name" minlength="2" maxlength="120" value="{{ request.form.get('name', '') }}" required></div>
            <div class="col-md-6"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" name="email" maxlength="255" value="{{ request.form.get('email', '') }}" autocomplete="email" required></div>
            <div class="col-md-6"><label for="roll_no" class="form-label">Roll number</label><input class="form-control" id="roll_no" name="roll_no" inputmode="numeric" pattern="[0-9]{1,13}" maxlength="13" title="Enter 1 to 13 digits only" value="{{ request.form.get('roll_no', '') }}" required></div>
            <div class="col-md-6"><label for="branch" class="form-label">Branch</label><select class="form-select" id="branch" name="branch" required><option value="">Select branch</option>{% for branch in ['CSE','AIML','IT','ECE','ME'] %}<option value="{{ branch }}" {% if request.form.get('branch') == branch %}selected{% endif %}>{{ branch }}</option>{% endfor %}</select></div>
            <div class="col-md-6"><label for="cgpa" class="form-label">CGPA</label><input type="number" step="0.01" min="0" max="10" class="form-control" id="cgpa" name="cgpa" value="{{ request.form.get('cgpa', '') }}" required></div>
            <div class="col-md-6"><label for="active_backlogs" class="form-label">Active backlogs</label><input type="number" min="0" max="40" step="1" class="form-control" id="active_backlogs" name="active_backlogs" value="{{ request.form.get('active_backlogs', '') }}" required></div>
            <div class="col-md-6"><label for="password" class="form-label">Password</label><input type="password" class="form-control" id="password" name="password" minlength="6" maxlength="128" autocomplete="new-password" required></div>
            <div class="col-md-6"><label for="confirm_password" class="form-label">Confirm password</label><input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" maxlength="128" autocomplete="new-password" required></div>
          </div>
          <button type="submit" class="btn btn-primary mt-4 w-100">Register</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
